name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit + golden tests (zero-dependency, no install)
        run: node --test test/*.test.ts
      - name: Codegen determinism gate — twice-run byte diff, all 8 targets (TDS 11.4, M4/M6)
        run: |
          for target in linux windows k8s-node sigma velociraptor mde falco logpoint; do
            rm -rf /tmp/run1 /tmp/run2
            node src/cli.ts transpile --sbob sbobs/redis.yaml --out /tmp/run1 --target "$target" --skip-signature-verify
            node src/cli.ts transpile --sbob sbobs/redis.yaml --out /tmp/run2 --target "$target" --skip-signature-verify
            diff -r /tmp/run1 /tmp/run2
            echo "determinism OK: $target"
          done
      - name: Attack-suite false-negative gate (TDS 11.3, M4)
        run: node scripts/attack-false-negative-check.ts
      - name: Engine blind-spot matrix gate (TDS 13, M6)
        run: node scripts/engine-matrix-check.ts
      - name: Enforce determinism gate — twice-run byte diff, all 3 enforce targets (TDS 14, M7)
        run: |
          for target in linux windows k8s-node; do
            rm -rf /tmp/enf1 /tmp/enf2
            node src/cli.ts enforce --sbob sbobs/redis.yaml --state test/enforce-fixtures/redis-enforce.state.yaml --out /tmp/enf1 --target "$target" --skip-signature-verify
            node src/cli.ts enforce --sbob sbobs/redis.yaml --state test/enforce-fixtures/redis-enforce.state.yaml --out /tmp/enf2 --target "$target" --skip-signature-verify
            diff -r /tmp/enf1 /tmp/enf2
            echo "enforce determinism OK: $target"
          done
          node src/cli.ts enforce --sbob sbobs/redis.yaml --state test/enforce-fixtures/redis-enforce.state.yaml --out /tmp/enf3 --target linux --skip-signature-verify
          node src/cli.ts enforce --sbob sbobs/redis.yaml --state test/enforce-fixtures/redis-bad-enforce.state.yaml --out /tmp/enf4 --target linux --skip-signature-verify && exit 1 || echo "state gate OK: enforce without audit record rejected"
      - name: Diff-gate determinism + golden report + verdict exit codes (TDS 16, M8)
        run: |
          node src/cli.ts diff --old test/diffgate-fixtures/base.yaml --new test/diffgate-fixtures/drifted.yaml --report /tmp/dg1.json > /tmp/dg1.md || dg_exit=$?
          test "$dg_exit" = 1
          node src/cli.ts diff --old test/diffgate-fixtures/base.yaml --new test/diffgate-fixtures/drifted.yaml --report /tmp/dg2.json > /tmp/dg2.md || true
          diff /tmp/dg1.md /tmp/dg2.md
          diff /tmp/dg1.json /tmp/dg2.json
          diff /tmp/dg1.json test/diffgate-fixtures/expected-report.json
          grep -q MANDATORY /tmp/dg1.md
          node src/cli.ts diff --old test/diffgate-fixtures/base.yaml --new test/diffgate-fixtures/base.yaml > /tmp/dg0.md
          grep -q "No scored behavior changes" /tmp/dg0.md
          echo "diff gate OK: deterministic, golden, verdict + exit codes"
      - name: Profiler determinism + goldens + taint/gate exit codes (TDS 17, M9)
        run: |
          prof_image="docker.io/legacy/cache@sha256:c0ffee00000000000000000000000000000000000000000000000000000000ff"
          node src/cli.ts profile --events test/profiler-fixtures/events.jsonl --workload legacy-cache --image "$prof_image" --k8s-namespace legacy-tier --out-dir /tmp/prof1 --dispositions test/profiler-fixtures/dispositions.json --baseline test/profiler-fixtures/baseline.yaml > /tmp/prof1.md
          node src/cli.ts profile --events test/profiler-fixtures/events.jsonl --workload legacy-cache --image "$prof_image" --k8s-namespace legacy-tier --out-dir /tmp/prof2 --dispositions test/profiler-fixtures/dispositions.json --baseline test/profiler-fixtures/baseline.yaml > /tmp/prof2.md
          diff /tmp/prof1.md /tmp/prof2.md
          diff -r /tmp/prof1 /tmp/prof2
          diff /tmp/prof1/legacy-cache.candidate.yaml test/profiler-fixtures/expected-candidate.yaml
          diff /tmp/prof1/legacy-cache.provenance.json test/profiler-fixtures/expected-provenance.json
          grep -q "status: \*\*CANDIDATE\*\*" /tmp/prof1.md
          grep -q "Odd behaviors" /tmp/prof1.md
          grep -q MANDATORY /tmp/prof1.md
          node src/cli.ts profile --events test/profiler-fixtures/events.jsonl --workload legacy-cache --image "$prof_image" --k8s-namespace legacy-tier --out-dir /tmp/prof3 --incident legacy-cache > /tmp/prof3.md || taint_exit=$?
          test "$taint_exit" = 1
          test ! -f /tmp/prof3/legacy-cache.candidate.yaml
          grep -q "Quarantined" /tmp/prof3.md
          echo "profiler OK: deterministic, goldens, gate + taint exit codes"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: TypeScript strict typecheck
        run: |
          npm install --no-save typescript@5.6.3 @types/node
          npx tsc --noEmit

