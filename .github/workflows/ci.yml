name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit + golden tests (zero-dependency, no install)
        run: node --test test/*.test.ts
      - name: Codegen determinism gate — twice-run byte diff, all 3 targets (TDS 11.4, M4)
        run: |
          for target in linux windows k8s-node; do
            rm -rf /tmp/run1 /tmp/run2
            node src/cli.ts transpile --sbob sbobs/redis.yaml --out /tmp/run1 --target "$target" --skip-signature-verify
            node src/cli.ts transpile --sbob sbobs/redis.yaml --out /tmp/run2 --target "$target" --skip-signature-verify
            diff -r /tmp/run1 /tmp/run2
            echo "determinism OK: $target"
          done
      - name: Attack-suite false-negative gate (TDS 11.3, M4)
        run: node scripts/attack-false-negative-check.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: TypeScript strict typecheck
        run: |
          npm install --no-save typescript@5.6.3 @types/node
          npx tsc --noEmit

