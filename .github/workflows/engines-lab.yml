name: SBoB phase-2 engine live lanes

on:
  schedule:
    - cron: "37 3 * * *" # nightly (UTC) — after the wazuh lab-validate matrix (03:17)
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write   # failure diagnostics are posted as PR comments

env:
  # pinned toolchain per engine — bump deliberately, like the wazuh manager image.
  # The logpoint lane rides an older sigma-cli: LogPoint's pySigma backend pins
  # pysigma <2.0, while sigma-cli 4.x requires pysigma >=2.0 — until LogPoint
  # ships a pysigma 2.x build the conversion lane stays on sigma-cli 3.x.
  SIGMA_CLI_VERSION: "4.0.0"
  LOGPOINT_SIGMA_CLI_VERSION: "3.1.0"
  PYSIGMA_LOGPOINT_VERSION: "1.0.2"
  FALCO_IMAGE: falcosecurity/falco:0.37.1
  VELOCIRAPTOR_VERSION: "0.77.3"

jobs:
  sigma:
    name: sigma (sigma-cli check on every generated rule)
    # nightly + dispatch always; on PRs only when explicitly labeled
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'engines-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transpile the sigma bundle
        run: |
          node src/cli.ts transpile --sbob sbobs/redis.yaml --out dist/bundle-sigma \
            --target sigma --registry docs/sbob-registry.yaml --skip-signature-verify
      - name: sigma-cli check (every generated rule must be a valid Sigma rule)
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check "sigma-cli==$SIGMA_CLI_VERSION" 2>&1 | tee /tmp/lane.log
          sigma version 2>&1 | tee -a /tmp/lane.log
          for f in dist/bundle-sigma/sigma/sbob/*.yml; do
            echo "checking $f" | tee -a /tmp/lane.log
            sigma check "$f" 2>&1 | tee -a /tmp/lane.log
          done
          echo "sigma check OK: $(ls dist/bundle-sigma/sigma/sbob/*.yml | wc -l) rules" | tee -a /tmp/lane.log
      - name: Post lane diagnostics to the PR (failure path)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## engines-lab diagnostics — sigma"
            echo '```'
            tail -c 6000 /tmp/lane.log 2>/dev/null || true
            echo '```'
          } > diag.md
          cat diag.md
          if [ -n "${PR_NUMBER:-}" ]; then
            jq -n --rawfile body diag.md '{body: $body}' > payload.json
            pcode=$(curl -sS -o post-resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d @payload.json || true)
            echo "diag comment POST -> HTTP ${pcode:-none}"
          fi

  logpoint:
    name: logpoint (sigma convert through LogPoint's official pipelines)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'engines-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Transpile the sigma bundle
        run: |
          node src/cli.ts transpile --sbob sbobs/redis.yaml --out dist/bundle-sigma \
            --target sigma --registry docs/sbob-registry.yaml --skip-signature-verify
      - name: Convert the auditd-plane rules through logpoint_linux
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check "sigma-cli==$LOGPOINT_SIGMA_CLI_VERSION" "pysigma-backend-logpoint==$PYSIGMA_LOGPOINT_VERSION" 2>&1 | tee /tmp/lane.log
          python -m pip list 2>/dev/null | grep -iE "sigma|pysigma" | tee -a /tmp/lane.log
          # pysigma-backend-logpoint 1.0.2 ships no entry_points.txt in its wheel
          # (upstream packaging bug), so `sigma convert -t logpoint` cannot discover
          # the backend via plugin autodiscovery. Import LogPoint's backend and
          # pipelines directly instead — same code path sigma-cli would drive.
          python - <<'PYEOF' 2>&1 | tee -a /tmp/lane.log
          import glob, sys
          from sigma.backends.logpoint import Logpoint
          from sigma.pipelines.logpoint import logpoint_linux_pipeline
          from sigma.collection import SigmaCollection

          backend = Logpoint(logpoint_linux_pipeline())
          queries = []
          for path in sorted(glob.glob("dist/bundle-sigma/sigma/sbob/*_linux.yml")):
              with open(path, encoding="utf-8") as f:
                  rules = SigmaCollection.from_yaml(f.read())
              out = backend.convert(rules)
              print(f"== {path}")
              for q in out:
                  print(q)
              queries.extend(out)
          if not queries:
              sys.exit("FAIL: no LQL queries produced")
          joined = "\n".join(queries)
          # LogPoint's own auditd taxonomy: type→event_type, exe/name→path
          if "SYSCALL" not in joined or "path" not in joined:
              sys.exit("FAIL: expected auditd-plane fields (SYSCALL, path) missing from LQL")
          print("logpoint linux conversion OK")
          PYEOF
      - name: Convert the Sysmon-plane rules through logpoint_windows
        shell: bash
        run: |
          set -o pipefail
          python - <<'PYEOF' 2>&1 | tee -a /tmp/lane.log
          import glob, sys
          from sigma.backends.logpoint import Logpoint
          from sigma.pipelines.logpoint import logpoint_windows_pipeline
          from sigma.collection import SigmaCollection

          backend = Logpoint(logpoint_windows_pipeline())
          queries = []
          for path in sorted(glob.glob("dist/bundle-sigma/sigma/sbob/*_windows.yml")):
              with open(path, encoding="utf-8") as f:
                  rules = SigmaCollection.from_yaml(f.read())
              out = backend.convert(rules)
              print(f"== {path}")
              for q in out:
                  print(q)
              queries.extend(out)
          if not queries:
              sys.exit("FAIL: no LQL queries produced")
          if "event_id" not in "\n".join(queries):
              sys.exit("FAIL: expected Sysmon event_id mapping missing from LQL")
          print("logpoint windows conversion OK")
          PYEOF
      - name: Post lane diagnostics to the PR (failure path)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## engines-lab diagnostics — logpoint"
            echo '```'
            tail -c 6000 /tmp/lane.log 2>/dev/null || true
            echo '```'
          } > diag.md
          cat diag.md
          if [ -n "${PR_NUMBER:-}" ]; then
            jq -n --rawfile body diag.md '{body: $body}' > payload.json
            pcode=$(curl -sS -o post-resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d @payload.json || true)
            echo "diag comment POST -> HTTP ${pcode:-none}"
          fi

  falco:
    name: falco (falco --validate on the generated rules)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'engines-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Transpile the falco bundle
        run: |
          node src/cli.ts transpile --sbob sbobs/redis.yaml --out dist/bundle-falco \
            --target falco --registry docs/sbob-registry.yaml --skip-signature-verify
      - name: Validate the generated rules against the pinned Falco engine
        shell: bash
        run: |
          set -o pipefail
          docker pull "$FALCO_IMAGE" 2>&1 | tee /tmp/lane.log
          # --validate loads only the named files: pass the image's standard
          # ruleset first so its macros (spawned_process et al.) are defined
          # when our custom rules load — the deployment context our bundle ships in
          docker run --rm -v "$PWD/dist/bundle-falco:/rules:ro" --entrypoint /usr/bin/falco \
            "$FALCO_IMAGE" \
            --validate /etc/falco/falco_rules.yaml \
            --validate /rules/falco/sbob/redis_rules.yaml 2>&1 | tee -a /tmp/lane.log
          grep -q "falco_rules.yaml: Ok" /tmp/lane.log
          grep -q "redis_rules.yaml: Ok" /tmp/lane.log
          echo "falco --validate OK" | tee -a /tmp/lane.log
      - name: Post lane diagnostics to the PR (failure path)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## engines-lab diagnostics — falco"
            echo '```'
            tail -c 6000 /tmp/lane.log 2>/dev/null || true
            echo '```'
          } > diag.md
          cat diag.md
          if [ -n "${PR_NUMBER:-}" ]; then
            jq -n --rawfile body diag.md '{body: $body}' > payload.json
            pcode=$(curl -sS -o post-resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d @payload.json || true)
            echo "diag comment POST -> HTTP ${pcode:-none}"
          fi

  velociraptor:
    name: velociraptor (VQL sweep queries executed on the runner)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'engines-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Transpile the velociraptor bundle and extract the sweep queries
        run: |
          node src/cli.ts transpile --sbob sbobs/redis.yaml --out dist/bundle-velo \
            --target velociraptor --registry docs/sbob-registry.yaml --skip-signature-verify
          node scripts/extract-vql.ts dist/bundle-velo/velociraptor/sbob/redis.yaml /tmp/vql
      - name: Run every sweep query with the pinned Velociraptor binary
        shell: bash
        run: |
          set -o pipefail
          curl -fsSL -o velociraptor.gz \
            "https://github.com/Velocidex/velociraptor/releases/download/v${VELOCIRAPTOR_VERSION}/velociraptor-v${VELOCIRAPTOR_VERSION}-linux-amd64-musl.gz" \
            2>&1 | tee /tmp/lane.log
          gunzip velociraptor.gz && chmod +x velociraptor
          ./velociraptor version 2>&1 | tee -a /tmp/lane.log
          queries="$(ls /tmp/vql/*.vql)"
          test "$(echo "$queries" | wc -l)" -ge 2
          for q in $queries; do
            echo "--- running $q" | tee -a /tmp/lane.log
            ./velociraptor query -f "$q" --format json 2>&1 | tee -a /tmp/lane.log
          done
          echo "velociraptor query OK: generated VQL parses and executes against live runner state" | tee -a /tmp/lane.log
      - name: Post lane diagnostics to the PR (failure path)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## engines-lab diagnostics — velociraptor"
            echo '```'
            tail -c 6000 /tmp/lane.log 2>/dev/null || true
            echo '```'
          } > diag.md
          cat diag.md
          if [ -n "${PR_NUMBER:-}" ]; then
            jq -n --rawfile body diag.md '{body: $body}' > payload.json
            pcode=$(curl -sS -o post-resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d @payload.json || true)
            echo "diag comment POST -> HTTP ${pcode:-none}"
          fi
