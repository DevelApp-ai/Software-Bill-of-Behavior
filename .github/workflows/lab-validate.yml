[{"type":"text","text":"successfully downloaded text file (SHA: 40517ae6ac7b276dbe1bde690a87e6b0f45f61fa)"},{"type":"resource","resource":{"uri":"repo://DevelApp-ai/Software-Bill-of-Behavior/sha/9cbcab428a67f9000022964757d0ef9c8df2d70b/contents/.github/workflows/lab-validate.yml","mimeType":"text/plain; charset=utf-8","text":"name: SBoB lab validation (containerized Wazuh manager)

# Lane lessons (issue #42): wazuh-control starts daemons with cwd
# /var/ossec/bin and analysisd's logtest module then fails its relative
# 'etc/ossec.conf' read (ERROR 7304) — the corpus + API gates below depend
# on the analysisd re-exec with cwd /var/ossec.\n\non:\n  schedule:\n    - cron: \"17 3 * * *\" # nightly (UTC) — all four targets, disposable manager\n  workflow_dispatch:\n  pull_request:\n    types: [opened, synchronize, labeled]\n\npermissions:\n  contents: read\n  pull-requests: write   # failure diagnostics are posted as PR comments\n\nenv:\n  # The disposable \"lab manager\" of this workflow is a pinned container:\n  # Wazuh >= 4.4 keeps BOTH testing surfaces — the wazuh-logtest binary and\n  # the PUT /logtest API. 5.x removes the binary (see docs/php2shell-scenario.md),\n  # so stay on 4.x until the 5.x KVDB content-manager lane lands.\n  WAZUH_IMAGE: wazuh/wazuh-manager:4.14.6\n  WAZUH_CONTAINER: sbob-wazuh-manager\n  WAZUH_API: https://localhost:55000\n  # Fresh-image API credentials (documented defaults of a clean wazuh-manager;\n  # throwaway container recreated per run — nothing to protect).\n  WAZUH_API_USER: wazuh\n  WAZUH_API_PASS: wazuh\n\njobs:\n  lab-validate:\n    name: lab-validate (${{ matrix.target }})\n    # nightly + dispatch always; on PRs only when explicitly labeled\n    if: >-\n      github.event_name != 'pull_request' ||\n      contains(github.event.pull_request.labels.*.name, 'lab-validate')\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    strategy:\n      fail-fast: false\n      matrix:\n        # corpus target → SBoB to transpile + sbobctl --target\n        include:\n          - target: linux\n            sbob: sbobs/redis.yaml\n            transpile-target: linux\n          - target: windows\n            sbob: sbobs/redis.yaml\n            transpile-target: windows\n          - target: k8s\n            sbob: sbobs/redis.yaml\n            transpile-target: k8s-node\n          - target: php\n            sbob: sbobs/php-fpm.yaml\n            transpile-target: linux\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with:\n          node-version: 22\n\n      - name: Start the disposable Wazuh manager (${{ env.WAZUH_IMAGE }})\n        run: |\n          docker pull \"$WAZUH_IMAGE\"\n          docker run -d --name \"$WAZUH_CONTAINER\" \\\n            -p 1514:1514 -p 1515:1515 -p 55000:55000 \\\n            \"$WAZUH_IMAGE\"\n          # wait up to 8 min: any HTTP response (even 401) means the API is listening\n          for i in $(seq 1 96); do\n            code=$(curl -sk -o /dev/null -w '%{http_code}' \"$WAZUH_API\" || true)\n            if [ \"$code\" != \"000\" ] && [ -n \"$code\" ]; then echo \"manager API up (HTTP $code after ~$((i*5))s)\"; exit 0; fi\n            if [ $((i % 12)) -eq 0 ]; then echo \"...still waiting for the API (HTTP $code)\"; fi\n            sleep 5\n          done\n          echo \"manager API did not come up\"\n          exit 1\n\n\n      - name: Transpile the bundle (sbob ${{ matrix.sbob }}, --target ${{ matrix.transpile-target }})\n        run: |\n          node src/cli.ts transpile --sbob ${{ matrix.sbob }} --out dist/bundle \\\n            --target ${{ matrix.transpile-target }} \\\n            --registry docs/sbob-registry.yaml --skip-signature-verify\n\n      - name: Install the bundle + declare the CDB lists in ossec.conf\n        run: |\n          # 1. stage into the manager layout — the exact lab mapping of\n          #    scripts/sync-manager.sh (rules/decoders flattened, CDB lists path-preserved)\n          # (invoked via sh: the checked-out file may not carry the exec bit)\n          sh scripts/sync-manager.sh dist/bundle --root staging\n          # not every bundle emits every part (e.g. windows has no CDB lists) —\n          # optional dirs must not fail the install\n          find staging -type f | sort\n\n          # 2. copy into the container's /var/ossec/etc/{rules,decoders,lists}\n          if [ -d staging/rules ]; then\n            docker cp staging/rules/. \"$WAZUH_CONTAINER:/var/ossec/etc/rules/\"\n          fi\n          if [ -d staging/decoders ]; then\n            docker cp staging/decoders/. \"$WAZUH_CONTAINER:/var/ossec/etc/decoders/\"\n          fi\n          if [ -d staging/lists ]; then\n            docker cp staging/lists/. \"$WAZUH_CONTAINER:/var/ossec/etc/lists/\"\n          fi\n\n          # 3. CDB lists are NOT auto-loaded by Wazuh: every generated sbob list\n          #    must be declared in the ossec.conf <ruleset> block\n          docker cp \"$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf\" ossec.conf\n          : > sbob-lists.snippet\n          if [ -d staging/lists/sbob ]; then\n            (cd staging/lists && find sbob -type f | sort) | while read -r rel; do\n              printf '    <list>etc/lists/%s</list>\\n' \"$rel\"\n            done >> sbob-lists.snippet\n          fi\n          if [ -s sbob-lists.snippet ]; then\n            awk '\n              BEGIN { while ((getline l < \"sbob-lists.snippet\") > 0) ins = ins l ORS }\n              !done && /<\\/ruleset>/ { printf \"%s\", ins; done = 1 }\n              { print }\n            ' ossec.conf > ossec.conf.new\n            mv ossec.conf.new ossec.conf\n            echo \"declared lists:\" && grep \"<list>etc/lists/sbob\" ossec.conf\n          else\n            echo \"no CDB lists in this bundle — ossec.conf left untouched\"\n          fi\n          docker cp ossec.conf \"$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf\"\n\n      - name: Restart the manager and wait for the API (bundle must load cleanly)\n        run: |\n          # restart via the container's own init path (docker restart), NOT via\n          # `docker exec wazuh-control restart`: wazuh-control starts daemons\n          # with cwd /var/ossec/bin (it does `cd \\`dirname $0\\``), and a daemon\n          # started there cannot resolve its own relative 'etc/ossec.conf' —\n          # analysisd logs ERROR 1226 + \"Invalid wazuh-logtest configuration\"\n          # (ERROR 7304, which kills the API logtest gate) and wazuh-monitord\n          # dies outright. The image's startup path has no such problem.\n          docker restart \"$WAZUH_CONTAINER\" >/dev/null\n          for i in $(seq 1 96); do\n            code=$(curl -sk -o /dev/null -w '%{http_code}' \"$WAZUH_API\" || true)\n            if [ \"$code\" != \"000\" ] && [ -n \"$code\" ]; then echo \"manager API up after restart (HTTP $code after ~$((i*5))s)\"; break; fi\n            if [ $((i % 12)) -eq 0 ]; then echo \"...still waiting for the API (HTTP $code)\"; fi\n            sleep 5\n          done\n          if [ \"$code\" = \"000\" ] || [ -z \"$code\" ]; then\n            echo \"manager API did not come back after the container restart\"\n            exit 1\n          fi\n          docker logs --tail 120 \"$WAZUH_CONTAINER\" > restart.log 2>&1 || true\n\n          # the install must survive the restart: if the image startup\n          # regenerated ossec.conf, the sbob <list> declarations are gone and\n          # the corpora would fire nothing (silent vacuous failure)\n          if [ -s sbob-lists.snippet ]; then\n            n=$(docker exec \"$WAZUH_CONTAINER\" sh -c 'grep -c \"<list>etc/lists/sbob\" /var/ossec/etc/ossec.conf || true' 2>/dev/null)\n            if ! [ \"${n:-}\" -ge 1 ] 2>/dev/null; then\n              echo \"FAIL: sbob <list> declarations did not survive the container restart (ossec.conf was regenerated?)\"\n              exit 1\n            fi\n            echo \"sbob <list> declarations survived the restart ($n)\"\n          else\n            echo \"no CDB lists in this bundle — skipping the declaration check\"\n          fi\n\n          # status gate: grep is the SOLE decider — wazuh-control status exits 1\n          # whenever ANY daemon is down (clusterd/dbd/csyslogd/... are routinely\n          # down in this image), so the pipeline must not inherit pipefail.\n          # status prints \"wazuh-analysisd is running...\" / \"not running...\":\n          # the anchor must spell the \"is\" (a bare \"running\" also matches\n          # \"...is not running\", and a bare \"^...running\" matches nothing).\n          docker exec -w /var/ossec \"$WAZUH_CONTAINER\" /var/ossec/bin/wazuh-control status > status.log 2>&1 || true\n          if grep -qE \"^wazuh-analysisd is running\" status.log; then\n            echo \"analysisd running with the bundle loaded\"\n            exit 0\n          fi\n          echo \"analysisd is NOT running — the manager rejected the ruleset\"\n          exit 1\n\n      - name: Rule-id hygiene + analysisd config gate (loud on silent-dropped configs)\n        run: |\n          set -o pipefail\n          # The stock local_rules.xml ships an ACTIVE example rule id 100001 that\n          # collides with the slot-0 signature band (0,1); the Wazuh linker keeps\n          # only the first occurrence (WARNING 7612) and silently drops the sbob\n          # signature rule. scripts/sync-manager.sh fails loudly on id collisions\n          # at deploy time; in the disposable lab manager the stock example is\n          # neutralized (an EMPTY rules file loads clean on 4.14.6 — a\n          # comment-only one errors with 'Group without any rule').\n          docker exec -w /var/ossec \"$WAZUH_CONTAINER\" sh -c ': > /var/ossec/etc/rules/local_rules.xml'\n          # restart analysisd with cwd /var/ossec: daemons started via\n          # wazuh-control inherit cwd /var/ossec/bin (wazuh-control does\n          # `cd \\`dirname $0\\``), and from there analysisd's logtest module\n          # cannot resolve its RELATIVE 'etc/ossec.conf' read — the module\n          # comes up invalid (ERROR 7304) and never serves the logtest socket,\n          # so both the wazuh-logtest binary (\"error when connecting with\n          # wazuh-analysisd\") and the API logtest gate fail while the daemon\n          # otherwise looks healthy (ERROR 1226 in ossec.log is the tell).\n          pid=$(docker exec \"$WAZUH_CONTAINER\" sh -c 'cat /var/ossec/var/run/wazuh-analysisd-*.pid 2>/dev/null | head -n 1')\n          if [ -n \"$pid\" ]; then\n            docker exec \"$WAZUH_CONTAINER\" sh -c \"kill ${pid} 2>/dev/null\" || true\n            sleep 3\n          fi\n          docker exec -d -w /var/ossec \"$WAZUH_CONTAINER\" /var/ossec/bin/wazuh-analysisd\n          sleep 8\n          # The config gate itself: analysisd -t must pass, and NO duplicate-id\n          # warnings may appear (7612 = a bundle rule was silently dropped).\n          docker exec -w /var/ossec \"$WAZUH_CONTAINER\" /var/ossec/bin/wazuh-analysisd -t 2>&1 | tee analysisd-t.log \\\n            || { echo \"FAIL: analysisd -t rejected the ruleset (see analysisd-t.log)\"; exit 1; }\n          if grep -E \"is duplicated\" analysisd-t.log; then\n            echo \"FAIL: duplicate rule ids (WARNING 7612) — a bundle rule is silently dropped\"\n            exit 1\n          fi\n          echo \"analysisd -t clean (only transient .tmp 1103 warnings allowed):\"\n          grep -v \"(1103)\" analysisd-t.log || true\n\n      - name: Corpus gate (wazuh-logtest — benign corpus silent, drift corpus fires)\n        run: |\n          # pipefail or the gate is vacuous: tee alone always exits 0, which is\n          # exactly how the committed 40931193214 run went green without testing\n          # anything (issue #42)\n          set -o pipefail\n          # wazuh-logtest reads the manager's live ruleset, so the corpus replay\n          # runs INSIDE the container; script + corpora ride along with it\n          docker cp test \"$WAZUH_CONTAINER:/test\"\n          docker cp scripts \"$WAZUH_CONTAINER:/sbob-scripts\"\n          docker exec -e SBOB_TARGET=\"${{ matrix.target }}\" -w /var/ossec \"$WAZUH_CONTAINER\" \\\n            bash -c 'PATH=\"/var/ossec/bin:$PATH\" bash /sbob-scripts/logtest-corpus.sh \"$SBOB_TARGET\"' 2>&1 | tee corpus-gate.log\n\n      - name: API detection gate (logtest API — JSON-asserted ids + sustained frequency children)\n        run: |\n          set -o pipefail\n          SBOB_WAZUH_API_USER=\"$WAZUH_API_USER\" SBOB_WAZUH_API_PASS=\"$WAZUH_API_PASS\" \\\n            node scripts/logtest-api.ts --target \"${{ matrix.target }}\" --api \"$WAZUH_API\" 2>&1 | tee api-gate.log\n\n      - name: Post manager diagnostics to the PR (failure path — placed last so it sees every prior step)\n        if: failure()\n        env:\n          GH_TOKEN: ${{ github.token }}\n          PR_NUMBER: ${{ github.event.pull_request.number }}\n        run: |\n          {\n            echo \"## lab-validate diagnostics — target \\`${{ matrix.target }}\\`\"\n            echo '```'\n            echo \"--- docker ps -a ---\"; docker ps -a 2>&1 || true\n            echo \"--- docker logs (tail 150) ---\"; docker logs --tail 150 \"$WAZUH_CONTAINER\" 2>&1 || true\n            echo \"--- ossec.log (tail 40) ---\"\n            docker exec \"$WAZUH_CONTAINER\" sh -c 'tail -40 /var/ossec/logs/ossec.log' 2>&1 || true\n            echo \"--- wazuh-control status ---\"\n            docker exec -w /var/ossec \"$WAZUH_CONTAINER\" /var/ossec/bin/wazuh-control status 2>&1 || true\n            echo \"--- queue sockets (logtest must exist) ---\"\n            docker exec \"$WAZUH_CONTAINER\" sh -c 'ls -la /var/ossec/queue/ossec/ 2>&1' || true\n            echo \"--- api probe (curl -skv) ---\"\n            curl -skv \"$WAZUH_API/\" 2>&1 | tail -25 || true\n            echo \"--- corpus-gate.log (tail 60) ---\"\n            tail -60 corpus-gate.log 2>&1 || true\n            echo \"--- analysisd-t.log (tail 30) ---\"\n            tail -30 analysisd-t.log 2>&1 || true\n            echo \"--- api-gate.log (tail 60) ---\"\n            tail -60 api-gate.log 2>&1 || true\n            echo \"--- corpus outputs inside the container ---\"\n            docker exec \"$WAZUH_CONTAINER\" sh -c 'tail -n 30 /tmp/sbob-benign.out 2>&1; echo ---; tail -n 30 /tmp/sbob-drift.out 2>&1' 2>&1 || true\n            echo '```'\n          } > diag.md\n          cat diag.md\n          # readback channel 1: PR comment via the REST API (status visible in annotations)\n          if [ -n \"${PR_NUMBER:-}\" ]; then\n            jq -n --rawfile body diag.md '{body: $body}' > payload.json\n            pcode=$(curl -sS -o post-resp.json -w '%{http_code}' -X POST \\\n              -H \"Authorization: Bearer $GH_TOKEN\" \\\n              -H \"Accept: application/vnd.github+json\" \\\n              \"https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments\" \\\n              -d @payload.json || true)\n            echo \"diag comment POST -> HTTP ${pcode:-none}: $(head -c 200 post-resp.json 2>/dev/null)\"\n            if [ \"${pcode:-}\" = \"201\" ]; then echo \"diagnostics comment posted\"; fi\n          fi\n          # readback channel 2: annotations carry the failing-step output (job logs are sign-in gated)\n          errs=$(docker exec \"$WAZUH_CONTAINER\" sh -c 'grep -ihE \"error|invalid|cannot|fail\" /var/ossec/logs/ossec.log 2>/dev/null | tail -10' 2>/dev/null || true)\n          if [ -n \"$errs\" ]; then\n            echo \"::error::ossec.log [${{ matrix.target }}]: $(printf '%s' \"$errs\" | head -c 1100 | tr '\\n' '~')\"\n          fi\n          if [ -s restart.log ]; then\n            echo \"::error::restart.log [${{ matrix.target }}]: $(tail -c 700 restart.log | tr '\\n' '~')\"\n          fi\n          if [ -s status.log ]; then\n            echo \"::error::status.log [${{ matrix.target }}]: $(grep -i analysisd status.log | tr '\\n' '~')\"\n          fi\n          if [ -s analysisd-t.log ]; then\n            echo \"::error::analysisd-t.log [${{ matrix.target }}]: $(grep -v '(1103)' analysisd-t.log | tail -c 700 | tr '\\n' '~')\"\n          fi\n          if [ -s corpus-gate.log ]; then\n            echo \"::error::corpus-gate.log [${{ matrix.target }}]: $(grep -E 'FAIL|Error|error|OK:|PASS' corpus-gate.log | tail -c 900 | tr '\\n' '~')\"\n          fi\n          if [ -s api-gate.log ]; then\n            echo \"::error::api-gate.log [${{ matrix.target }}]: $(tail -c 700 api-gate.log | tr '\\n' '~')\"\n          fi\n"}}]