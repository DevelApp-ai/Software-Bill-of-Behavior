name: SBoB lab validation (containerized Wazuh manager)

on:
  schedule:
    - cron: "17 3 * * *" # nightly (UTC) — all four targets, disposable manager
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: read
  pull-requests: write   # failure diagnostics are posted as PR comments

env:
  # The disposable "lab manager" of this workflow is a pinned container:
  # Wazuh >= 4.4 keeps BOTH testing surfaces — the wazuh-logtest binary and
  # the PUT /logtest API. 5.x removes the binary (see docs/php2shell-scenario.md),
  # so stay on 4.x until the 5.x KVDB content-manager lane lands.
  WAZUH_IMAGE: wazuh/wazuh-manager:4.14.6
  WAZUH_CONTAINER: sbob-wazuh-manager
  WAZUH_API: https://localhost:55000
  # Fresh-image API credentials (documented defaults of a clean wazuh-manager;
  # throwaway container recreated per run — nothing to protect).
  WAZUH_API_USER: wazuh
  WAZUH_API_PASS: wazuh

jobs:
  lab-validate:
    name: lab-validate (${{ matrix.target }})
    # nightly + dispatch always; on PRs only when explicitly labeled
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'lab-validate')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # corpus target → SBoB to transpile + sbobctl --target
        include:
          - target: linux
            sbob: sbobs/redis.yaml
            transpile-target: linux
          - target: windows
            sbob: sbobs/redis.yaml
            transpile-target: windows
          - target: k8s
            sbob: sbobs/redis.yaml
            transpile-target: k8s-node
          - target: php
            sbob: sbobs/php-fpm.yaml
            transpile-target: linux
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Start the disposable Wazuh manager (${{ env.WAZUH_IMAGE }})
        run: |
          docker pull "$WAZUH_IMAGE"
          docker run -d --name "$WAZUH_CONTAINER" \
            -p 1514:1514 -p 1515:1515 -p 55000:55000 \
            "$WAZUH_IMAGE"
          # wait up to 8 min: any HTTP response (even 401) means the API is listening
          for i in $(seq 1 96); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$WAZUH_API" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "manager API up (HTTP $code after ~$((i*5))s)"; exit 0; fi
            if [ $((i % 12)) -eq 0 ]; then echo "...still waiting for the API (HTTP $code)"; fi
            sleep 5
          done
          echo "manager API did not come up"
          exit 1

      - name: Post manager diagnostics to the PR (failure path)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## lab-validate diagnostics — target \`${{ matrix.target }}\`"
            echo '```'
            echo "--- docker ps -a ---"; docker ps -a 2>&1 || true
            echo "--- docker logs (tail 150) ---"; docker logs --tail 150 "$WAZUH_CONTAINER" 2>&1 || true
            echo "--- ossec.log (tail 40) ---"
            docker exec "$WAZUH_CONTAINER" sh -c 'tail -40 /var/ossec/logs/ossec.log' 2>&1 || true
            echo "--- wazuh-control status ---"
            docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control status 2>&1 || true
            echo "--- api probe (curl -skv) ---"
            curl -skv "$WAZUH_API/" 2>&1 | tail -25 || true
            echo "--- corpus-gate.log (tail 60) ---"
            tail -60 corpus-gate.log 2>&1 || true
            echo "--- api-gate.log (tail 60) ---"
            tail -60 api-gate.log 2>&1 || true
            echo "--- corpus outputs inside the container ---"
            docker exec "$WAZUH_CONTAINER" sh -c 'tail -30 /tmp/sbob-benign.out /tmp/sbob-drift.out' 2>&1 || true
            echo '```'
          } > diag.md
          cat diag.md
          # readback channel 1: PR comment via the REST API (status visible in annotations)
          if [ -n "${PR_NUMBER:-}" ]; then
            jq -n --rawfile body diag.md '{body: $body}' > payload.json
            pcode=$(curl -sS -o post-resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -d @payload.json || true)
            echo "diag comment POST -> HTTP ${pcode:-none}: $(head -c 200 post-resp.json 2>/dev/null)"
            if [ "${pcode:-}" = "201" ]; then echo "diagnostics comment posted"; fi
          fi
          # readback channel 2: annotations carry the error grep (job logs are sign-in gated)
          errs=$(docker exec "$WAZUH_CONTAINER" sh -c 'grep -ihE "error|invalid|cannot|fail" /var/ossec/logs/ossec.log 2>/dev/null | tail -10' 2>/dev/null || true)
          if [ -n "$errs" ]; then
            echo "::error::ossec.log [${{ matrix.target }}]: $(printf '%s' "$errs" | head -c 1100 | tr '\n' '~')"
          fi
          if [ -s restart.log ]; then
            echo "::error::restart.log [${{ matrix.target }}]: $(tail -c 500 restart.log | tr '\n' '~')"
          fi

      - name: Transpile the bundle (sbob ${{ matrix.sbob }}, --target ${{ matrix.transpile-target }})
        run: |
          node src/cli.ts transpile --sbob ${{ matrix.sbob }} --out dist/bundle \
            --target ${{ matrix.transpile-target }} \
            --registry docs/sbob-registry.yaml --skip-signature-verify

      - name: Install the bundle + declare the CDB lists in ossec.conf
        run: |
          # 1. stage into the manager layout — the exact lab mapping of
          #    scripts/sync-manager.sh (rules/decoders flattened, CDB lists path-preserved)
          # (invoked via sh: the checked-out file may not carry the exec bit)
          sh scripts/sync-manager.sh dist/bundle --root staging
          # not every bundle emits every part (e.g. windows has no CDB lists) —
          # optional dirs must not fail the install
          find staging -type f | sort

          # 2. copy into the container's /var/ossec/etc/{rules,decoders,lists}
          if [ -d staging/rules ]; then
            docker cp staging/rules/. "$WAZUH_CONTAINER:/var/ossec/etc/rules/"
          fi
          if [ -d staging/decoders ]; then
            docker cp staging/decoders/. "$WAZUH_CONTAINER:/var/ossec/etc/decoders/"
          fi
          if [ -d staging/lists ]; then
            docker cp staging/lists/. "$WAZUH_CONTAINER:/var/ossec/etc/lists/"
          fi

          # 3. CDB lists are NOT auto-loaded by Wazuh: every generated sbob list
          #    must be declared in the ossec.conf <ruleset> block
          docker cp "$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf" ossec.conf
          : > sbob-lists.snippet
          if [ -d staging/lists/sbob ]; then
            (cd staging/lists && find sbob -type f | sort) | while read -r rel; do
              printf '    <list>etc/lists/%s</list>\n' "$rel"
            done >> sbob-lists.snippet
          fi
          if [ -s sbob-lists.snippet ]; then
            awk '
              BEGIN { while ((getline l < "sbob-lists.snippet") > 0) ins = ins l ORS }
              !done && /<\/ruleset>/ { printf "%s", ins; done = 1 }
              { print }
            ' ossec.conf > ossec.conf.new
            mv ossec.conf.new ossec.conf
            echo "declared lists:" && grep "<list>etc/lists/sbob" ossec.conf
          else
            echo "no CDB lists in this bundle — ossec.conf left untouched"
          fi
          docker cp ossec.conf "$WAZUH_CONTAINER:/var/ossec/etc/ossec.conf"

      - name: Restart the manager and wait for the API (bundle must load cleanly)
        run: |
          # wazuh-control restart can return non-zero for timing reasons; the real
          # gates below are the API probe + analysisd actually running with the bundle
          docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control restart 2>&1 | tee restart.log \
            || echo "wazuh-control restart rc=$? (continuing — the probe below is the gate)"
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "$WAZUH_API" || true)
            if [ "$code" != "000" ] && [ -n "$code" ]; then echo "manager API up after restart (HTTP $code)"; break; fi
            sleep 5
          done
          if [ "$code" = "000" ] || [ -z "$code" ]; then
            echo "manager API did not come back after the bundle install"
            exit 1
          fi
          if docker exec "$WAZUH_CONTAINER" /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q "analysisd.*running"; then
            echo "analysisd running with the bundle loaded"
            exit 0
          fi
          echo "analysisd is NOT running — the manager rejected the ruleset"
          exit 1

      - name: Corpus gate (wazuh-logtest — benign corpus silent, drift corpus fires)
        run: |
          # wazuh-logtest reads the manager's live ruleset, so the corpus replay
          # runs INSIDE the container; script + corpora ride along with it
          docker cp test "$WAZUH_CONTAINER:/test"
          docker cp scripts "$WAZUH_CONTAINER:/sbob-scripts"
          docker exec -e SBOB_TARGET="${{ matrix.target }}" "$WAZUH_CONTAINER" \
            bash -c 'PATH="/var/ossec/bin:$PATH" bash /sbob-scripts/logtest-corpus.sh "$SBOB_TARGET"' 2>&1 | tee corpus-gate.log

      - name: API detection gate (logtest API — JSON-asserted ids + sustained frequency children)
        run: |
          SBOB_WAZUH_API_USER="$WAZUH_API_USER" SBOB_WAZUH_API_PASS="$WAZUH_API_PASS" \
            node scripts/logtest-api.ts --target "${{ matrix.target }}" --api "$WAZUH_API" 2>&1 | tee api-gate.log
