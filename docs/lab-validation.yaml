# sbobctl lab-validation evidence (M1-M4 exit criteria, issues #2/#3/#4/#5).
#
# One record per workload whose generated bundle was replayed against a live
# Wazuh manager by .github/workflows/lab-validate.yml (corpus gate +
# API detection gate) and passed. Presence of a record here is the flip:
# `sbobctl transpile --lab-validation docs/lab-validation.yaml` stamps every
# workload x target listed below as LAB VALIDATED (banner + manifest evidence
# field); pairs without a record keep the LAB VALIDATION PENDING banner.
# The golden bundles under test/golden/ are regenerated with the same flag.
#
# fields:
#   workload  SBoB workload name (must match the IR workload name)
#   targets   validated codegen targets (linux | windows | k8s-node)
#   manager   pinned manager image the corpus was replayed against
#   date      validation date (YYYY-MM-DD)
#   evidence  Actions run URL of the green lab-validate matrix
#
# RETRACTED (issue #42): the records previously listed here cited Actions run
#   https://github.com/DevelApp-ai/Software-Bill-of-Behavior/actions/runs/40931193214
# that run was VACUOUSLY GREEN: the 4.14.6 transpiled bundles did not actually
# load on the wazuh-manager (9 loader defects — duplicate slot collisions with
# the shipped local_rules.xml example, undeclared CDB lists silently dropping
# their rules, PCRE2 conditions on static fields, bare-rule files without the
# mandatory <group> wrapper, child-sustained rules rendered with loop-captured
# ids), and the lane asserted nothing about it (no analysisd -t gate, stale
# logtest output spelling, 2>/dev/null silencing stderr). The evidence is
# retracted: every workload x target pair is LAB VALIDATION PENDING until a
# green lab-validate run of the FIXED transpiler + FIXED lane stamps a new
# record here (the run URL of the green matrix is the new evidence).
#
# RE-STAMPED (issue #42): run 44582667834 is the FIRST green lab-validate
# matrix of the fixed transpiler + the hardened lane (real analysisd -t gate,
# zero-warning assertion, per-target matrix isolation, anchored pipefail
# greps, 4.14 logtest output spelling, mandatory CDB list <list> declarations,
# inert local_rules.xml placeholder, windows root-anchor validation transform
# + restore). All four targets (redis linux/windows/k8s-node + php-fpm linux)
# replayed against the pinned wazuh/wazuh-manager:4.14.6 container: drift
# corpora fired the full expected rule-id sets, benign corpora stayed silent,
# sustained corpora escalated on the 8th repetition.
validations:
  - workload: redis
    targets: [linux, k8s-node, windows]
    manager: wazuh/wazuh-manager:4.14.6
    date: 2026-11-19
    evidence: https://github.com/DevelApp-ai/Software-Bill-of-Behavior/actions/runs/44582667834
  - workload: php-fpm
    targets: [linux]
    manager: wazuh/wazuh-manager:4.14.6
    date: 2026-11-19
    evidence: https://github.com/DevelApp-ai/Software-Bill-of-Behavior/actions/runs/44582667834
